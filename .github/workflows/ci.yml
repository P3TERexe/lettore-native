name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installa dipendenze
        run: |
          pip install "ruff==0.16.4"
          pip install -r backend/requirements.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Unit test
        run: python -m unittest discover -s tests

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder sidecar (gitignored)
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/lettore-backend-aarch64-apple-darwin
          chmod +x src-tauri/binaries/lettore-backend-aarch64-apple-darwin
      - name: Cargo check
        run: cargo check --quiet
        working-directory: src-tauri
